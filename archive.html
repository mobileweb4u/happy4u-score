<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY4U Archive Manager</title>
    <style>
        :root { --neon-green: #00ff44; --neon-blue: #0088ff; }
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 450px; border: 2px solid var(--neon-green); padding: 20px; border-radius: 20px; background: #111; box-shadow: 0 0 20px rgba(0,255,68,0.2); }
        h2 { color: var(--neon-green); text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .btn { 
            width: 100%; padding: 18px; border: none; font-weight: bold; border-radius: 12px; 
            margin: 10px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem;
        }
        .export-btn { background: var(--neon-blue); color: white; }
        .import-btn { background: #222; color: var(--neon-green); border: 2px solid var(--neon-green); }
        .home-btn { background: #444; color: white; margin-top: 20px; }
        
        #display-area { 
            margin-top: 20px; padding: 20px; background: #000; border-radius: 15px; 
            display: none; border: 1px solid #333; animation: fadeIn 0.5s;
        }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; align-items: center; }
        .val { color: var(--neon-green); font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="card">
    <h2>📁 Archive Center</h2>
        <p style="text-align: center; color: #888; font-size: 0.8rem;">Completed League Matches</p>
        
        <div id="completed-list" style="margin-top: 15px;">
            <p style="color: #888; text-align:center;">Loading completed matches...</p>
        </div>

        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

        <div id="display-area">
            <h3 id="m-names" style="color: var(--neon-blue); margin-top: 0; text-align: center;"></h3>
            <div id="m-stats"></div>
        </div>

        <button class="btn export-btn" onclick="saveActiveMatch()">
            <b>💾 SAVE LATEST MATCH</b>
        </button>

        <button class="btn import-btn" onclick="document.getElementById('sdPicker').click()">
            <b>🔍 IMPORT MATCH JSON</b>
        </button>

        <input type="file" id="sdPicker" style="display:none" onchange="readSDFile(event)">
    
    <div id="return-to-winner-container" style="margin-top: 10px;"></div>

    <button class="btn home-btn" onclick="window.location.href='index.html'">
        ⬅ RETURN TO SCOREBOARD
    </button>
</div>

<script>
    let allMatchesHistory = []; // Store the clean list of matches globally

    // --- SAVE/EXPORT FUNCTIONS (No changes needed here) ---
    function saveActiveMatch() {
        const data = localStorage.getItem('happy4u_data');
        if (!data) return alert("No active match found! Play a game on the scoreboard first.");

        const state = JSON.parse(data);
        const fileName = `Match_${state.gameState.p1Name}_vs_${state.gameState.p2Name}_${Date.now()}.json`;
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
        alert("Active match exported!");
    }

    // --- LOAD/IMPORT FUNCTIONS ---
    function readSDFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                // Check if it's a valid match file from our app
                if (json.gameState) {
                    renderStats(json.gameState);
                } else {
                    alert("Error: This file does not appear to be a valid match report from HAPPY4U.");
                }
            } catch (err) {
                alert("Error: Could not read or parse the file.");
            }
        };
        reader.readAsText(file);
    }

    // --- RENDER/DISPLAY FUNCTIONS ---
    function renderStats(gameState) {
        const area = document.getElementById('display-area');
        const statsEl = document.getElementById('m-stats');
        
        const name1 = gameState.p1Name || 'Player 1';
        const name2 = gameState.p2Name || 'Player 2';
        const score1 = gameState.p1Score ?? 0;
        const score2 = gameState.p2Score ?? 0;

        document.getElementById('m-names').innerText = `${name1} vs ${name2}`;
        statsEl.innerHTML = `
            <div class="stat-row"><span>Final Score</span> <span class="val">${score1} - ${score2}</span></div>
            <div class="stat-row"><span>Race To</span> <span class="val">${gameState.raceTo || 'N/A'}</span></div>
            <div class="stat-row"><span>${name1} Dishes</span> <span class="val">${gameState.p1Dishes ?? 0}</span></div>
            <div class="stat-row"><span>${name2} Dishes</span> <span class="val">${gameState.p2Dishes ?? 0}</span></div>
            <div class="stat-row"><span>Match ID</span> <span class="val" style="font-size:0.75rem">${gameState.matchID || 'N/A'}</span></div>
        `;
        area.style.display = 'block';
    }

    /**
     * --- FIX ---
     * This function now reads 'happy4u_profiles' and builds the list of completed matches.
     */
    function renderCompletedMatches() {
        const listEl = document.getElementById('completed-list');
        const playerProfiles = JSON.parse(localStorage.getItem('happy4u_profiles')) || {};
        allMatchesHistory = []; // Reset the global history
        const processedMatchIDs = new Set();

        // Loop through all players and collect their match history
        for (const playerName in playerProfiles) {
            const profile = playerProfiles[playerName];
            if (profile && profile.history) {
                profile.history.forEach(matchRecord => {
                    if (matchRecord.matchID && !processedMatchIDs.has(matchRecord.matchID)) {
                        allMatchesHistory.push({
                            p1Name: playerName,
                            p2Name: matchRecord.opponent,
                            score: matchRecord.score,
                            matchID: matchRecord.matchID,
                            result: matchRecord.result
                        });
                        processedMatchIDs.add(matchRecord.matchID);
                    }
                });
            }
        }

        if (allMatchesHistory.length === 0) {
            listEl.innerHTML = '<p style="color: #888; text-align: center;">No completed league matches found.</p>';
            return;
        }

        // Generate the HTML for the list
        listEl.innerHTML = allMatchesHistory.map(match => {
            const winnerName = match.result === 'WIN' ? match.p1Name : match.p2Name;
            const loserName = match.result === 'WIN' ? match.p2Name : match.p1Name;
            return `
                <div class="stat-row" style="flex-wrap: wrap; gap: 10px;">
                    <div>${winnerName} vs ${loserName}</div>
                    <div class="val">${match.score}</div>
                    <button class="btn" style="flex-basis: 100%; background: #222; color: var(--neon-green); border: 1px solid var(--neon-green); padding: 10px;" onclick="viewMatch('${match.matchID}')">
                        VIEW DETAILS
                    </button>
                </div>
            `;
        }).join('');
    }

    /**
     * --- FIX ---
     * This function now finds the match in our globally stored `allMatchesHistory` array.
     */
    function viewMatch(matchId) {
        const matchData = allMatchesHistory.find(m => m.matchID === matchId);
        if (!matchData) return alert('Match record not found.');
        
        // To render stats, we need a gameState object. We'll reconstruct one.
        const scores = matchData.score.split('-').map(s => parseInt(s.trim()));
        const reconstructedGameState = {
            p1Name: matchData.p1Name,
            p2Name: matchData.p2Name,
            p1Score: scores[0],
            p2Score: scores[1],
            matchID: matchData.matchID,
            // We don't have dish data in the summary, so we show 0
            p1Dishes: 'N/A',
            p2Dishes: 'N/A',
            raceTo: 'N/A' // Also not in summary
        };
        renderStats(reconstructedGameState);
    }
    
    // Initial load function
    window.addEventListener('load', () => {
        renderCompletedMatches();
    });
</script>

</body>
</html>
