<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Night Calendar</title>
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --border-color: #262626;
            --accent-cyan: #00e5ff;
            --text-bright: #e0e0e0;
            --text-muted: #777777;
            --grid-active: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-bright);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .ledger-container {
            width: 100%;
            max-width: 1100px;
        }

        .header-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .nav-home-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            width: 250px;
        }
        .nav-home-link:hover { text-decoration: underline; }

        .header-section h1 {
            margin: 0;
            flex: 1;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #ffffff;
            font-weight: 800;
            text-transform: uppercase;
        }

        .calendar-dashboard {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {
            .calendar-dashboard { grid-template-columns: 1fr; }
        }

        .calendar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-controls h3 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-btn {
            background: #1c1c1c;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .weekday-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            padding-bottom: 8px;
        }

        .calendar-day {
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            aspect-ratio: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .calendar-day:hover { border-color: #555; }
        .calendar-day.empty { background: transparent; border: none; cursor: default; }
        
        .calendar-day .day-num {
            font-size: 14px;
            font-weight: 700;
            align-self: flex-start;
            color: #aaa;
        }

        .calendar-day.has-records {
            border-color: rgba(0, 229, 255, 0.3);
            background: linear-gradient(145deg, #0d0d0d 0%, #101f24 100%);
        }
        .calendar-day.has-records .day-num {
            color: #ffffff;
        }
        .calendar-day.has-records::after {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            align-self: center;
            margin-bottom: 4px;
            box-shadow: 0 0 8px var(--accent-cyan);
        }

        .calendar-day.selected-day {
            background: var(--grid-active) !important;
            border-color: var(--accent-cyan) !important;
        }

        .sidebar-records-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-date-header {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .match-history-item-list {
            overflow-y: auto;
            flex: 1;
        }

        .match-mini-card {
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .match-mini-card:hover {
            border-color: var(--accent-cyan);
            background: #111;
        }

        .match-mini-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .match-mini-players {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 760px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
        }

        .modal-header h3 { 
            margin: 0; 
            color: var(--accent-cyan); 
            font-size: 1.1rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-close-x {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close-x:hover { color: #fff; }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            background-color: #080808;
        }

        .raw-log-block {
            background: #040404;
            border: 1px solid #161616;
            border-radius: 6px;
            padding: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #d8d8d8;
            white-space: pre-wrap;
            overflow-x: auto;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="ledger-container">
    <div class="header-section">
        <a class="nav-home-link" href="PracticeLedger.html">← Back To Ledger Stats Table</a>
        <h1>Practice Night Calendar</h1>
        <div style="width: 250px;"></div>
    </div>

    <div class="calendar-dashboard">
        <div class="calendar-card">
            <div class="calendar-controls">
                <button class="nav-btn" onclick="adjustMonth(-1)">◀ Prev</button>
                <h3 id="calendar-month-title">Month Year</h3>
                <button class="nav-btn" onclick="adjustMonth(1)">Next ▶</button>
            </div>
            <div class="calendar-grid" id="calendar-grid-target"></div>
        </div>

        <div class="sidebar-records-panel">
            <h3 class="sidebar-date-header" id="panel-date-title">Select A Date</h3>
            <div class="match-history-item-list" id="panel-history-list">
                <p style="color: var(--text-muted); font-size: 13px; text-align: center; padding-top: 30px; line-height: 1.6;">
                    Select any calendar day highlighted with an indicator badge to analyze performance reports.
                </p>
            </div>
        </div>
    </div>
</div>

<div id="records-modal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Complete Full Frame Breakdown</h3>
            <button class="modal-close-x" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <pre class="raw-log-block" id="modal-log-content"></pre>
        </div>
    </div>
</div>

<script>
    let organizedHistoryMap = {};
    let activeCalendarDate = new Date(2026, 4, 21); // Defaults directly to May 2026

    document.addEventListener("DOMContentLoaded", () => {
        parseStorageDataToCalendarMap();
        buildCalendarViewGrid();
        setupModalDismissEvents();
    });

    function parseStorageDataToCalendarMap() {
        const rawHistory = JSON.parse(localStorage.getItem('completed_matches_history')) || [];
        organizedHistoryMap = {};

        rawHistory.forEach(logString => {
            const rawText = (typeof logString === 'string' ? logString : '');
            if (!rawText.trim()) return;

            // Group multiple match reports within a single item block
            const subBlocks = rawText.split(/(?=╔═════════════════════════════════════════════════════╗)/);
            
            // Look for general session timestamp data at the top of the item block
            const sessionDateMatch = rawText.match(/SESSION DATE:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
            const sessionTimeMatch = rawText.match(/SESSION DATE:\s*\d{2}\/\d{2}\/\d{4},\s*([^\n\r]+)/i);
            const sessionIdMatch = rawText.match(/SESSION ID:\s*([A-Za-z0-9_-]+)/i);

            let fallbackDateKey = null;
            let fallbackDateRaw = "";
            let fallbackTime = "11:17:11";
            let fallbackId = "MATCH-UNKNOWN";

            if (sessionDateMatch) {
                fallbackDateKey = `${sessionDateMatch[3]}-${sessionDateMatch[2]}-${sessionDateMatch[1]}`;
                fallbackDateRaw = `${sessionDateMatch[1]}/${sessionDateMatch[2]}/${sessionDateMatch[3]}`;
                if (sessionTimeMatch) fallbackTime = sessionTimeMatch[1].replace(/SESSION ID:/i, '').trim();
                if (sessionIdMatch) fallbackId = sessionIdMatch[1].replace(/COMPLETE/i, '').trim();
            }

            let collectedMatchesForThisDay = [];

            subBlocks.forEach(block => {
                if (!block.trim() || !block.includes("HAPPY4U MATCH REPORT")) return;
                
                const dateMatch = block.match(/DATE:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
                const timeMatch = block.match(/DATE:\s*\d{2}\/\d{2}\/\d{4},\s*([^\n\r]+)/i);
                const idMatch = block.match(/MATCH ID:\s*([A-Za-z0-9_-]+)/i);

                let currentKey = fallbackDateKey;
                let currentDateRaw = fallbackDateRaw;
                let currentTime = fallbackTime;
                let currentId = fallbackId;

                if (dateMatch) {
                    currentKey = `${dateMatch[3]}-${dateMatch[2]}-${dateMatch[1]}`;
                    currentDateRaw = `${dateMatch[1]}/${dateMatch[2]}/${dateMatch[3]}`;
                    if (timeMatch) currentTime = timeMatch[1].trim();
                    if (idMatch) currentId = idMatch[1].trim();
                }

                if (currentKey) {
                    collectedMatchesForThisDay.push({
                        key: currentKey,
                        time: currentTime,
                        id: currentId,
                        dateRaw: currentDateRaw,
                        fullPayload: block.trim()
                    });
                }
            });

            // Bucket array data mapped to calendar days dynamically
            collectedMatchesForThisDay.forEach(matchObj => {
                if (!organizedHistoryMap[matchObj.key]) {
                    organizedHistoryMap[matchObj.key] = [];
                }
                organizedHistoryMap[matchObj.key].push(matchObj);
            });
        });
    }

    function buildCalendarViewGrid() {
        const grid = document.getElementById('calendar-grid-target');
        const title = document.getElementById('calendar-month-title');
        grid.innerHTML = '';

        const year = activeCalendarDate.getFullYear();
        const month = activeCalendarDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        title.innerText = `${monthNames[month]} ${year}`;

        const weekDays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
        weekDays.forEach(day => {
            grid.innerHTML += `<div class="weekday-label">${day}</div>`;
        });

        const initialDayIndex = new Date(year, month, 1).getDay();
        const daysInCurrentMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < initialDayIndex; i++) {
            grid.innerHTML += `<div class="calendar-day empty"></div>`;
        }

        for (let day = 1; day <= daysInCurrentMonth; day++) {
            const paddedDay = String(day).padStart(2, '0');
            const paddedMonth = String(month + 1).padStart(2, '0');
            const lookupKey = `${year}-${paddedMonth}-${paddedDay}`;

            const sessionRecords = organizedHistoryMap[lookupKey] || [];
            const hasSessionsClass = sessionRecords.length > 0 ? 'has-records' : '';

            const dayTile = document.createElement('div');
            dayTile.className = `calendar-day ${hasSessionsClass}`;
            dayTile.innerHTML = `<span class="day-num">${day}</span>`;
            
            dayTile.addEventListener('click', () => {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected-day'));
                dayTile.classList.add('selected-day');
                displayDailySessionPanelList(lookupKey, day, monthNames[month]);
            });

            grid.appendChild(dayTile);
        }
    }

    function displayDailySessionPanelList(dateKey, dayNum, monthName) {
        document.getElementById('panel-date-title').innerText = `${monthName} ${dayNum}, ${activeCalendarDate.getFullYear()}`;
        const listContainer = document.getElementById('panel-history-list');
        listContainer.innerHTML = '';

        const matches = organizedHistoryMap[dateKey] || [];

        if (matches.length === 0) {
            listContainer.innerHTML = `<p style="color: var(--text-muted); font-size:13px; text-align:center; padding-top:20px;">No logs recorded for this day.</p>`;
            return;
        }

        const itemCard = document.createElement('div');
        itemCard.className = "match-mini-card";
        itemCard.innerHTML = `
            <div class="match-mini-time">LOGGED ENTRIES: ${matches.length} RACES</div>
            <div class="match-mini-players">VIEW COMPLETE BREAKDOWN</div>
        `;
        
        itemCard.addEventListener('click', () => {
            renderAggregatedSessionReport(matches);
        });

        listContainer.appendChild(itemCard);
    }

    function renderAggregatedSessionReport(matchesArray) {
        if (matchesArray.length === 0) return;

        const rootMatch = matchesArray[0];
        let compiledOutputText = `SESSION DATE:\n ${rootMatch.dateRaw}, ${rootMatch.time}\nSESSION ID:\n ${rootMatch.id}\nCOMPLETE FULL FRAME BREAKDOWN\n\n`;

        let summaryConcsTextList = "";
        let playerStatsCounter = {};

        matchesArray.forEach((match) => {
            compiledOutputText += `${match.fullPayload}\n\n\n`;

            const lines = match.fullPayload.split('\n');
            let winnerName = "UNKNOWN";
            let scoreLineStr = "0-0";

            lines.forEach(line => {
                const scoreMatch = line.match(/SCORE:\s*([A-Za-z0-9_-]+)\s*\((\d+)\)\s*-\s*([A-Za-z0-9_-]+)\s*\((\d+)\)/i);
                const winMsgMatch = line.match(/CONGRATULATIONS WINNER\s+([A-Za-z0-9_-]+)/i);

                if (scoreMatch) {
                    const p1 = scoreMatch[1].toUpperCase();
                    const s1 = parseInt(scoreMatch[2], 10);
                    const p2 = scoreMatch[3].toUpperCase();
                    const s2 = parseInt(scoreMatch[4], 10);

                    if (!playerStatsCounter[p1]) playerStatsCounter[p1] = { name: p1, framesFor: 0, framesAgainst: 0, matchesWon: 0, matchesLost: 0 };
                    if (!playerStatsCounter[p2]) playerStatsCounter[p2] = { name: p2, framesFor: 0, framesAgainst: 0, matchesWon: 0, matchesLost: 0 };

                    playerStatsCounter[p1].framesFor += s1;
                    playerStatsCounter[p1].framesAgainst += s2;
                    playerStatsCounter[p2].framesFor += s2;
                    playerStatsCounter[p2].framesAgainst += s1;
                    
                    scoreLineStr = `${s1}-${s2}`;
                }

                if (winMsgMatch) {
                    winnerName = winMsgMatch[1].toUpperCase();
                }
            });

            if (winnerName !== "UNKNOWN") {
                Object.keys(playerStatsCounter).forEach(pKey => {
                    if (pKey === winnerName) {
                        playerStatsCounter[pKey].matchesWon++;
                    } else {
                        playerStatsCounter[pKey].matchesLost++;
                    }
                });
                summaryConcsTextList += `CONGRATULATIONS WINNER ${winnerName}\nFINAL SCORE: ${scoreLineStr}\n\n`;
            }
        });

        compiledOutputText = compiledOutputText.trimEnd() + `\n\n------------------------------------------------------\n`;
        compiledOutputText += summaryConcsTextList;
        compiledOutputText += `Total \n`;

        const sortedPlayers = Object.values(playerStatsCounter).sort((a, b) => {
            if (a.name.includes("FREDDIE")) return -1;
            if (b.name.includes("FREDDIE")) return 1;
            return 0;
        });

        sortedPlayers.forEach(player => {
            const spacesCount = 16 - player.name.length;
            const spaces = " ".repeat(spacesCount > 0 ? spacesCount : 1);
            compiledOutputText += `${player.name}${spaces}| FRAME-F: ${player.framesFor} | FRAME-A: ${player.framesAgainst}\n`;
            compiledOutputText += `${player.name} (${player.matchesWon}-${player.matchesLost}) \n\n`;
        });

        compiledOutputText = compiledOutputText.trimEnd();
        compiledOutputText += `\n____________________________________________________\n`;
        compiledOutputText += `____________________________________________________\n`;
        compiledOutputText += `            GENERATED BY Freddie Russell                    `;

        document.getElementById('modal-log-content').textContent = compiledOutputText;
        document.getElementById('records-modal').style.display = 'flex';
    }

    window.closeModal = function() {
        document.getElementById('records-modal').style.display = 'none';
    };

    window.adjustMonth = function(direction) {
        activeCalendarDate.setMonth(activeCalendarDate.getMonth() + direction);
        buildCalendarViewGrid();
        document.getElementById('panel-date-title').innerText = "Select A Date";
        document.getElementById('panel-history-list').innerHTML = `<p style="color: var(--text-muted); font-size: 13px; text-align: center; padding-top: 30px; line-height: 1.6;">Select any calendar day highlighted with an indicator badge to analyze performance reports.</p>`;
    };

    function setupModalDismissEvents() {
        const modal = document.getElementById('records-modal');
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    }
</script>
</body>
</html>
