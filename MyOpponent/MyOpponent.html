<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frederick Russell [3] - Match Schedule</title>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: auto; border: 2px solid #00ff44; padding: 25px; border-radius: 15px; }
        h1 { color: #00ff44; text-align: center; text-transform: uppercase; border-bottom: 2px solid #00ff44; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #1a1a1a; }
        th, td { padding: 15px; border: 1px solid #333; text-align: center; }
        th { background-color: #00ff44; color: black; font-size: 0.9em; }
        .save-btn { background: #00ff44; color: black; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; border-radius: 5px; text-transform: uppercase; }
        .save-btn:hover { background: #00f2ff; box-shadow: 0 0 10px #00f2ff; }
        .path-label { text-align: center; font-size: 0.8em; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Frederick Russell [3] - Match Schedule</h1>
        <table>
            <thead>
                <tr>
                    <th>Opponent</th>
                    <th>Handicap</th>
                    <th>Your Start</th>
                    <th>Their Start</th>
                    <th>Your "Real"</th>
                    <th>Their "Real"</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="opponent-table-body">
                </tbody>
        </table>
        <div class="path-label">Target Folder: /home/freddie/Desktop/happy4u-score-main9/MyOpponent</div>
    </div>

    <script src="MyOpponent.js"></script>
    <script>
        const tbody = document.getElementById('opponent-table-body');

        // Build the table using MyOpponentData
        MyOpponentData.opponents.forEach(opp => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${opp.name}</td>
                <td>${opp.handicap}</td>
                <td style="color:#00ff44">${opp.youStart}</td>
                <td>${opp.themStart}</td>
                <td>${opp.youReal} Frames</td>
                <td>${opp.themReal} Frames</td>
                <td><button class="save-btn" onclick="saveMatchData('${opp.name}', '${opp.youReal}')">Save Match</button></td>
            `;
            tbody.appendChild(row);
        });

        // Your Blob logic implemented here
        function saveMatchData(name, realRace) {
            const date = new Date().toLocaleDateString();
            
            const reportContent = `
BAR 8 CHAMPIONS LEAGUE REPORT
------------------------------
Date: ${date}
Player: Frederick Russell [3]
Opponent: ${name}
Your "Real" Race: ${realRace} Frames
Target: Race to 11

STATUS: Match Recorded Successfully.
------------------------------
Folder: /MyOpponent
            `;

            const blob = new Blob([reportContent], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            
            // Filename example: Report_Anthony_10-05-2024.txt
            link.download = `Report_${name}_${date.replace(/\//g, '-')}.txt`;
            
            link.click();
            
            alert("Report Generated! Move the file from your Downloads to your MyOpponent folder.");
        }
    </script>
</body>
</html>
